<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Library</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>My Library</h1>
    <button id="new-book-btn">New Book</button>
  </header>

  <main>
    <div id="book-grid"></div>
  </main>

  <dialog id="book-dialog">
    <div class="dialog-header">
      <h2>Add a book</h2>
      <button type="button" id="cancel-btn" class="icon-btn" aria-label="Close">&times;</button>
    </div>
    <form id="book-form">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="Title" required />

      <label for="author">Author</label>
      <input type="text" id="author" name="author" placeholder="Author" required />

      <label for="pages">Pages</label>
      <input type="number" id="pages" name="pages" placeholder="Pages" min="1" required />

      <label class="checkbox-label">
        <input type="checkbox" id="read" name="read" />
        Already read
      </label>

      <button type="submit" class="primary-btn">Add book</button>
    </form>
  </dialog>

  <script src="js/script.js"></script>
</body>
</html>
